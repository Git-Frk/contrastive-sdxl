[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contrastive-sdxl"
version = "0.1.0"
description = "Unpaired image translation with SDXL-Turbo and DINOv2-guided contrastive objectives"
requires-python = ">=3.10,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
